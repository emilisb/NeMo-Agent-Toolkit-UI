services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX
      - CORS_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: /run/base44/app.env
        required: false
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3099/ || { echo 'next dev failed'; exit 1; }; curl -fsS -o /dev/null http://localhost:3000/ || { echo 'gateway failed'; exit 1; }"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 240s

volumes:
  node_modules:
  next_cache:
