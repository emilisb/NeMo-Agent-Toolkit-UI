services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache libc6-compat &&
        npm ci &&
        npm run dev
      "
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - NEXT_INTERNAL_URL=http://localhost:3099
      - HOSTNAME=0.0.0.0
      - NAT_BACKEND_URL=http://localhost:8000
      - CORS_ORIGIN=*
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - .env
      - /run/base44/app.env

volumes:
  node_modules:
