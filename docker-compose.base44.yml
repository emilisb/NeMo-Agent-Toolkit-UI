services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    command: ["sh", "-ec", "npm install --no-audit --no-fund --no-package-lock && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 30 -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 35s
      retries: 6
      start_period: 300s
    restart: on-failure
volumes:
  node_modules:
  next_cache:
