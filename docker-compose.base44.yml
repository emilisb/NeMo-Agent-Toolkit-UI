services:
  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3000
      - NEXT_INTERNAL_URL=http://localhost:3099
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - ALLOWED_DEV_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: >
      sh -c "
        apk add --no-cache libc6-compat &&
        npm ci &&
        npm run dev
      "

volumes:
  node_modules:
